<!DOCTYPE html> <html> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>GPS Test</title> <style> html, body { margin: 0; padding: 20px; font-family: Arial, sans-serif; } </style> </head> <body> <h2>GPS Test</h2> <div id="status">Starting...</div> <script> console.log("JavaScript started"); if (!navigator.geolocation) { document.getElementById("status").textContent = "Geolocation is NOT supported"; } else { document.getElementById("status").textContent = "Requesting GPS..."; navigator.geolocation.getCurrentPosition( function(position) { console.log("GPS POSITION:", position); const lat = position.coords.latitude; const lon = position.coords.longitude; const accuracy = position.coords.accuracy; document.getElementById("status").innerHTML = "GPS WORKS!<br><br>" + "Latitude: " + lat + "<br>" + "Longitude: " + lon + "<br>" + "Accuracy: " + Math.round(accuracy) + " meters"; }, function(error) { console.log("GPS ERROR:", error); document.getElementById("status").innerHTML = "GPS ERROR<br><br>" + "Code: " + error.code + "<br>" + "Message: " + error.message; }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 } ); } </script> </body> </html>
