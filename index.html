<!DOCTYPE html> <html> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>GPS Map</title> <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" /> <style> html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; } /* Direction arrow */ .heading-marker { width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 32px solid #1976ff; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); transform-origin: 50% 75%; } /* Small status box */ #status { position: fixed; top: 10px; left: 10px; z-index: 1000; background: rgba(255,255,255,.9); padding: 8px 12px; border-radius: 8px; font-family: Arial, sans-serif; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.25); } </style> </head> <body> <div id="map"></div> <div id="status"> Waiting for GPS... </div> <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script> <script> // -------------------------------------------------- // MAP // -------------------------------------------------- const map = L.map("map", { zoomControl: false }).setView([44.8, 20.45], 17); L.tileLayer( "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "&copy; OpenStreetMap contributors" } ).addTo(map); // -------------------------------------------------- // GPS VARIABLES // -------------------------------------------------- let positionMarker = null; let accuracyCircle = null; let firstLocation = true; let targetLat = null; let targetLon = null; let displayedLat = null; let displayedLon = null; let targetHeading = 0; let displayedHeading = 0; let lastGpsTime = 0; // Visual delay. // Increase this for smoother but more delayed movement. const DISPLAY_DELAY = 2000; // -------------------------------------------------- // HEADING ARROW // -------------------------------------------------- const arrowIcon = L.divIcon({ className: "", html: '<div class="heading-marker"></div>', iconSize: [24, 32], iconAnchor: [12, 24] }); // -------------------------------------------------- // ANGLE HELPERS // -------------------------------------------------- function normalizeAngle(angle) { angle %= 360; if (angle < 0) angle += 360; return angle; } // Find shortest rotation between two headings. function shortestAngleDifference(from, to) { let difference = normalizeAngle(to) - normalizeAngle(from); if (difference > 180) difference -= 360; if (difference < -180) difference += 360; return difference; } // -------------------------------------------------- // GPS // -------------------------------------------------- navigator.geolocation.watchPosition( position => { const coords = position.coords; targetLat = coords.latitude; targetLon = coords.longitude; lastGpsTime = performance.now(); // GPS heading is degrees clockwise from north. if ( coords.heading !== null && coords.heading !== undefined && !isNaN(coords.heading) ) { targetHeading = coords.heading; } // Create marker if (!positionMarker) { positionMarker = L.marker( [targetLat, targetLon], { icon: arrowIcon, rotationAngle: targetHeading, rotationOrigin: "center center" } ).addTo(map); positionMarker.bindPopup("You are here"); accuracyCircle = L.circle( [targetLat, targetLon], { radius: coords.accuracy, color: "#1976ff", fillColor: "#1976ff", fillOpacity: 0.12, weight: 1 } ).addTo(map); } else { accuracyCircle.setLatLng([ targetLat, targetLon ]); accuracyCircle.setRadius( coords.accuracy ); } // First GPS fix if (firstLocation) { displayedLat = targetLat; displayedLon = targetLon; displayedHeading = targetHeading; positionMarker.setLatLng([ displayedLat, displayedLon ]); positionMarker.getElement().style.transform += ` rotate(${displayedHeading}deg)`; map.setView( [displayedLat, displayedLon], 17 ); firstLocation = false; } document.getElementById("status").innerHTML = `GPS accuracy: ${Math.round(coords.accuracy)} m` + `<br>Heading: ${Math.round(targetHeading)}°`; }, error => { document.getElementById("status").innerHTML = "GPS error: " + error.message; }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 } ); // -------------------------------------------------- // SMOOTH ANIMATION // -------------------------------------------------- function animate() { if ( targetLat !== null && displayedLat !== null ) { /* * Position smoothing. * * Smaller number = slower/smoother. * Larger number = more responsive. */ const positionSmoothing = 0.08; displayedLat += (targetLat - displayedLat) * positionSmoothing; displayedLon += (targetLon - displayedLon) * positionSmoothing; /* * Heading smoothing. * * Handles the 359° → 0° transition * correctly. */ const angleDifference = shortestAngleDifference( displayedHeading, targetHeading ); displayedHeading += angleDifference * 0.12; displayedHeading = normalizeAngle(displayedHeading); // Update marker if (positionMarker) { positionMarker.setLatLng([ displayedLat, displayedLon ]); const element = positionMarker.getElement(); if (element) { const arrow = element.querySelector(".heading-marker"); if (arrow) { arrow.style.transform = `rotate(${displayedHeading}deg)`; } } } // Update accuracy circle if (accuracyCircle) { accuracyCircle.setLatLng([ displayedLat, displayedLon ]); } /* * Keep map centered. * * We don't instantly jump the map. * Leaflet smoothly pans toward us. */ if (!firstLocation) { map.panTo( [displayedLat, displayedLon], { animate: false } ); } } requestAnimationFrame(animate); } animate(); // -------------------------------------------------- // DEVICE COMPASS FALLBACK // -------------------------------------------------- window.addEventListener( "deviceorientationabsolute", event => { /* * Some Android browsers provide compass * heading through alpha. */ if ( event.alpha !== null && event.alpha !== undefined ) { targetHeading = normalizeAngle(360 - event.alpha); } }, true ); </script> </body> </html>
