<!DOCTYPE html> <html> <head> <meta charset="UTF-8">

<title>Automotive GPS</title> <!-- ================================================== LEAFLET ================================================== --> <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" > <!-- ================================================== STYLE ================================================== --> <style>
html,
body {

  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

  overflow: hidden;

  background: #eeeeee;

  font-family: Arial, sans-serif;

}

/* --------------------------------------------------
   MAP
   -------------------------------------------------- */

#map {

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  background: #eeeeee;

}

/*
  This container is what we rotate.

  The GPS position itself stays visually
  in the middle of the screen.
*/

#map-rotation {

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  transform-origin: center center;

}

/* --------------------------------------------------
   GPS POSITION INDICATOR
   -------------------------------------------------- */

.gps-position {

  width: 18px;
  height: 18px;

  background: #1976ff;

  border: 3px solid white;

  border-radius: 50%;

  box-shadow:
    0 1px 5px rgba(0, 0, 0, 0.45);

}

/* --------------------------------------------------
   GPS HEADING CONE
   -------------------------------------------------- */

.gps-heading {

  position: absolute;

  left: 50%;
  bottom: 15px;

  transform:
    translateX(-50%);

  width: 0;
  height: 0;

  border-left: 12px solid transparent;
  border-right: 12px solid transparent;

  border-bottom: 24px solid #1976ff;

  opacity: 0.9;

}

/* --------------------------------------------------
   STATUS PANEL
   -------------------------------------------------- */

#status {

  position: fixed;

  top: 10px;
  left: 10px;

  z-index: 2000;

  background: rgba(255, 255, 255, 0.94);

  padding: 9px 12px;

  border-radius: 8px;

  font-size: 13px;

  line-height: 1.45;

  color: #222;

  box-shadow:
    0 2px 7px rgba(0, 0, 0, 0.25);

}

/* --------------------------------------------------
   CENTER BUTTON
   -------------------------------------------------- */

#centerButton {

  position: fixed;

  right: 15px;
  bottom: 20px;

  z-index: 2000;

  width: 48px;
  height: 48px;

  border: none;

  border-radius: 50%;

  background: white;

  box-shadow:
    0 2px 8px rgba(0, 0, 0, 0.3);

  font-size: 22px;

  cursor: pointer;

}

</style> </head> <body> <!-- ================================================== MAP ROTATION CONTAINER ================================================== --> <div id="map-rotation">
<div id="map"></div>

</div> <!-- ================================================== GPS INDICATOR ================================================== --> <div id="gpsIndicator" style=" position: fixed; left: 50%; top: 50%; z-index: 1500; transform: translate(-50%, -50%); pointer-events: none; " >
<div class="gps-heading"></div>

<div class="gps-position"></div>

Requesting GPS...

</div> <!-- ================================================== CENTER BUTTON ================================================== --> <button id="centerButton">
●

</button> <!-- ================================================== LEAFLET JAVASCRIPT ================================================== --> <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" ></script> <script>
// ==================================================
// SETTINGS
// ==================================================

/*
  How much GPS history we keep.

  The map displays a position approximately
  2 seconds behind the newest GPS reading.
*/

const DISPLAY_DELAY = 2000;

/*
  Position smoothing.

  Lower = smoother
  Higher = more responsive
*/

const POSITION_SMOOTHING = 0.10;

/*
  Map rotation smoothing.

  Lower = smoother
  Higher = faster response
*/

const ROTATION_SMOOTHING = 0.08;

/*
  Maximum GPS history entries.
*/

const HISTORY_LENGTH = 200;

// ==================================================
// MAP
// ==================================================

const map = L.map(
  "map",
  {
    zoomControl: false,
    attributionControl: true
  }
);

/*
  Minimal monochrome map.

  Carto's light basemap gives us a cleaner,
  automotive-style appearance than the
  standard colorful OpenStreetMap tiles.
*/

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

 {
  attribution:
    "&copy; OpenStreetMap contributors",

  maxZoom:
    19
}
).addTo(map);

// ==================================================
// GPS VARIABLES
// ==================================================

const gpsHistory = [];

let displayedLat = null;

let displayedLon = null;

let displayedHeading = 0;

let targetRotation = 0;

let firstFix = true;

let accuracyCircle = null;

// ==================================================
// ANGLE FUNCTIONS
// ==================================================

/*
  Convert any angle into:

  0° - 360°
*/

function normalizeAngle(angle) {

  angle =
    angle % 360;

  if (angle < 0) {

    angle += 360;

  }

  return angle;

}

/*
  Find the shortest rotation between
  two angles.

  This prevents:

  359° → 1°

  from rotating almost a full circle.
*/

function shortestAngleDifference(
  from,
  to
) {

  let difference =

    normalizeAngle(to) -
    normalizeAngle(from);

  if (difference > 180) {

    difference -= 360;

  }

  if (difference < -180) {

    difference += 360;

  }

  return difference;

}

// ==================================================
// GPS
// ==================================================

console.log(
  "Starting GPS..."
);

navigator.geolocation.watchPosition(

  // ------------------------------------------------
  // SUCCESS
  // ------------------------------------------------

  function(position) {

    console.log(
      "GPS POSITION:",
      position
    );

    const latitude =
      position.coords.latitude;

    const longitude =
      position.coords.longitude;

    const accuracy =
      position.coords.accuracy;

    const heading =
      position.coords.heading;

    const timestamp =
      Date.now();

    // ----------------------------------------------
    // STORE GPS READING
    // ----------------------------------------------

    gpsHistory.push({

      latitude:
        latitude,

      longitude:
        longitude,

      accuracy:
        accuracy,

      heading:
        heading,

      timestamp:
        timestamp

    });

    // ----------------------------------------------
    // REMOVE OLD READINGS
    // ----------------------------------------------

    while (

      gpsHistory.length >
      HISTORY_LENGTH

    ) {

      gpsHistory.shift();

    }

    // ----------------------------------------------
    // FIRST FIX
    // ----------------------------------------------

    if (firstFix) {

      displayedLat =
        latitude;

      displayedLon =
        longitude;

      /*
        Put the map around the user's position.
      */

      map.setView(

        [
          latitude,
          longitude
        ],

        17,

        {
          animate:
            false
        }

      );

      /*
        Accuracy circle.
      */

      accuracyCircle =

        L.circle(

          [
            latitude,
            longitude
          ],

          {

            radius:
              accuracy,

            color:
              "#1976ff",

            fillColor:
              "#1976ff",

            fillOpacity:
              0.10,

            weight:
              1

          }

        ).addTo(map);

      firstFix =
        false;

    }

    // ----------------------------------------------
    // STATUS
    // ----------------------------------------------

    let headingText =
      "Unknown";

    if (

      heading !== null &&
      heading !== undefined &&
      !isNaN(heading)

    ) {

      headingText =

        Math.round(heading) +
        "°";

    }

    document.getElementById(
      "status"
    ).innerHTML =

      "GPS OK<br>" +

      "Accuracy: " +
      Math.round(accuracy) +
      " m<br>" +

      "Heading: " +
      headingText;

  },

  // ------------------------------------------------
  // ERROR
  // ------------------------------------------------

  function(error) {

    console.log(
      "GPS ERROR:",
      error
    );

    document.getElementById(
      "status"
    ).innerHTML =

      "GPS ERROR<br><br>" +

      "Code: " +
      error.code +
      "<br>" +

      error.message;

  },

  // ------------------------------------------------
  // GPS OPTIONS
  // ------------------------------------------------

  {

    enableHighAccuracy:
      true,

    maximumAge:
      0,

    timeout:
      20000

  }

);

// ==================================================
// GET DELAYED POSITION
// ==================================================

function getDelayedPosition() {

  if (
    gpsHistory.length === 0
  ) {

    return null;

  }

  const targetTime =

    Date.now() -
    DISPLAY_DELAY;

  let previous =
    null;

  let next =
    null;

  // ----------------------------------------------
  // FIND GPS SAMPLES
  // ----------------------------------------------

  for (
    let i = 0;
    i < gpsHistory.length;
    i++
  ) {

    const sample =
      gpsHistory[i];

    if (
      sample.timestamp <=
      targetTime
    ) {

      previous =
        sample;

    }

    if (
      sample.timestamp >
      targetTime
    ) {

      next =
        sample;

      break;

    }

  }

  // ----------------------------------------------
  // NOT ENOUGH HISTORY
  // ----------------------------------------------

  if (!previous) {

    return gpsHistory[0];

  }

  if (!next) {

    return previous;

  }

  // ----------------------------------------------
  // INTERPOLATION
  // ----------------------------------------------

  const timeRange =

    next.timestamp -
    previous.timestamp;

  const timePassed =

    targetTime -
    previous.timestamp;

  const amount =

    Math.max(
      0,
      Math.min(
        1,
        timePassed /
        timeRange
      )
    );

  // ----------------------------------------------
  // POSITION
  // ----------------------------------------------

  const latitude =

    previous.latitude +

    (
      next.latitude -
      previous.latitude
    ) *

    amount;

  const longitude =

    previous.longitude +

    (
      next.longitude -
      previous.longitude
    ) *

    amount;

  // ----------------------------------------------
  // HEADING
  // ----------------------------------------------

  let heading =
    previous.heading;

  if (

    previous.heading !== null &&
    previous.heading !== undefined &&

    next.heading !== null &&
    next.heading !== undefined

  ) {

    const difference =

      shortestAngleDifference(

        previous.heading,
        next.heading

      );

    heading =

      normalizeAngle(

        previous.heading +

        difference *
        amount

      );

  }

  return {

    latitude:
      latitude,

    longitude:
      longitude,

    accuracy:
      previous.accuracy,

    heading:
      heading

  };

}

// ==================================================
// ANIMATION
// ==================================================

function animate() {

  const position =
    getDelayedPosition();

  if (
    position &&
    !firstFix
  ) {

    // ----------------------------------------------
    // SMOOTH POSITION
    // ----------------------------------------------

    displayedLat +=

      (
        position.latitude -
        displayedLat
      ) *

      POSITION_SMOOTHING;

    displayedLon +=

      (
        position.longitude -
        displayedLon
      ) *

      POSITION_SMOOTHING;

    // ----------------------------------------------
    // MOVE MAP
    // ----------------------------------------------

    map.setView(

      [
        displayedLat,
        displayedLon
      ],

      map.getZoom(),

      {
        animate:
          false
      }

    );

    // ----------------------------------------------
    // ACCURACY CIRCLE
    // ----------------------------------------------

    if (accuracyCircle) {

      accuracyCircle.setLatLng(

        [
          displayedLat,
          displayedLon
        ]

      );

    }

    // ----------------------------------------------
    // HEADING
    // ----------------------------------------------

    if (

      position.heading !== null &&
      position.heading !== undefined

    ) {

      /*
        We want the user's direction
        to point toward the TOP of the screen.

        GPS heading:

        0°   = North
        90°  = East
        180° = South
        270° = West

        Therefore the map must rotate
        in the opposite direction.
      */

      targetRotation =

        -position.heading;

      const difference =

        shortestAngleDifference(

          displayedHeading,

          targetRotation

        );

      displayedHeading +=

        difference *
        ROTATION_SMOOTHING;

      /*
        Apply rotation to the map.

        IMPORTANT:

        The blue GPS indicator is NOT
        rotated with the map.
      */

      document
        .getElementById("map-rotation")
        .style.transform =

          "rotate(" +
          displayedHeading +
          "deg)";

    }

  }

  // ----------------------------------------------
  // CONTINUE ANIMATION
  // ----------------------------------------------

  requestAnimationFrame(
    animate
  );

}

// ==================================================
// START ANIMATION
// ==================================================

animate();

// ==================================================
// CENTER BUTTON
// ==================================================

document
  .getElementById("centerButton")
  .addEventListener(
    "click",
    function() {

      if (
        displayedLat !== null &&
        displayedLon !== null
      ) {

        map.setView(

          [
            displayedLat,
            displayedLon
          ],

          17,

          {
            animate:
              true
          }

        );

      }

    }
  );

</script> </body> </html>
